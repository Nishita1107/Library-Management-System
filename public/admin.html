<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — RAIT Smart Library</title>
  <script>
    (function() {
      var match = document.cookie.match(new RegExp('(^| )theme=([^;]+)'));
      var theme = (match ? match[2] : null) || localStorage.getItem('theme');
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root {
      --maroon: #800000;
      --maroon-dark: #2a1414;
      --maroon-light: #fdf5f5;
      --white: #ffffff;
      --gray: #f4f4f4;
      --card-bg: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #e0e0e0;
      --red: #c00;
      --red-bg: #ffeaea;
      --green: #1a7a1a;
      --green-bg: #edfaed;
      --orange: #b85c00;
      --orange-bg: #fff4e5;
      --input-bg: #ffffff;
    }

    [data-theme="dark"], body[data-theme="dark"] {
      --maroon: #9e2a2b;
      --maroon-dark: #1a0c0c;
      --maroon-light: #2c1616;
      --white: #1e1e1e;
      --gray: #121212;
      --card-bg: #1e1e1e;
      --text: #f0f0f0;
      --muted: #aaaaaa;
      --border: #333333;
      --red: #ef5350;
      --red-bg: #331010;
      --green: #4caf50;
      --green-bg: #132a13;
      --orange: #ffa726;
      --orange-bg: #2e1e07;
      --input-bg: #292929;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background: var(--gray); color: var(--text); transition: background-color 0.2s, color 0.2s; }

    /* Navbar */
    .navbar { background: var(--maroon-dark); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 60px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .nav-brand { display: flex; align-items: center; gap: 12px; }
    .nav-brand img { height: 38px; }
    .nav-brand span { font-size: 15px; font-weight: 700; color: #fff; }
    .nav-right { display: flex; gap: 12px; align-items: center; }
    .nav-link { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 14px; border-radius: 6px; }
    .nav-link:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .logout-btn { background: transparent; border: 1.5px solid rgba(255,255,255,0.4); color: #fff; padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; }
    .logout-btn:hover { background: rgba(255,255,255,0.15); }
    .theme-toggle-btn { background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3); color: #ffffff; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .theme-toggle-btn:hover { background: rgba(255,255,255,0.25); }

    /* Layout */
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 420px 1fr; gap: 28px; align-items: start; }
    @media (max-width: 900px) { .page { grid-template-columns: 1fr; } }

    /* Panel card */
    .panel { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid var(--border); overflow: hidden; }
    .panel-header { background: var(--maroon); color: #fff; padding: 18px 24px; font-size: 16px; font-weight: 700; }
    .panel-body { padding: 24px; }

    /* Form */
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: var(--input-bg); color: var(--text);
      transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--maroon); }
    .field textarea { resize: vertical; min-height: 70px; }
    .field input.error { border-color: var(--red); }

    /* Image preview */
    .img-preview { margin-top: 10px; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); background: var(--input-bg); height: 140px; display: flex; align-items: center; justify-content: center; }
    .img-preview img { max-height: 140px; max-width: 100%; object-fit: contain; display: none; }
    .img-preview .placeholder { font-size: 12px; color: var(--muted); }

    /* Tag checkboxes */
    .tag-group { margin-bottom: 14px; }
    .tag-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--maroon); margin-bottom: 8px; }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-chip { display: flex; align-items: center; gap: 5px; }
    .tag-chip input[type="checkbox"] { accent-color: var(--maroon); width: 14px; height: 14px; cursor: pointer; }
    .tag-chip label { font-size: 13px; cursor: pointer; padding: 4px 10px; border-radius: 20px; background: var(--gray); border: 1.5px solid var(--border); color: var(--text); transition: all 0.15s; user-select: none; }
    .tag-chip input:checked + label { background: var(--maroon-light); border-color: var(--maroon); color: var(--maroon); font-weight: 700; }

    /* Submit */
    .submit-btn { width: 100%; padding: 12px; background: var(--maroon); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; margin-top: 4px; }
    .submit-btn:hover:not(:disabled) { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Search & Filter toolbar */
    .filter-toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .search-input-wrap { flex: 2; min-width: 180px; }
    .filter-input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--input-bg); color: var(--text); outline: none; transition: border-color 0.2s; }
    .filter-input:focus, .filter-select:focus { border-color: var(--maroon); }
    .filter-dropdowns { display: flex; gap: 8px; flex: 2; min-width: 220px; }
    .filter-select { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--input-bg); color: var(--text); outline: none; cursor: pointer; transition: border-color 0.2s; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 9999; pointer-events: none; max-width: 320px; }
    #toast.show { opacity: 1; }
    #toast.success { background: var(--green); color: #fff; }
    #toast.error   { background: var(--red);   color: #fff; }

    /* Books list */
    .books-list { display: flex; flex-direction: column; gap: 14px; }
    .book-item { background: var(--card-bg); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border: 1px solid var(--border); padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
    .book-cover { width: 60px; height: 80px; border-radius: 6px; object-fit: cover; background: var(--gray); flex-shrink: 0; border: 1px solid var(--border); }
    .book-cover.no-img { display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .book-info { flex: 1; min-width: 0; }
    .book-info h3 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-info .author { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .book-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .tag-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--maroon-light); color: var(--maroon); }
    .book-meta { font-size: 12px; color: var(--muted); }
    .book-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .del-btn { font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; background: var(--red-bg); color: var(--red); font-family: inherit; }
    .del-btn:hover { background: var(--red); color: #fff; }
    .copies-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-align: center; }
    .copies-badge.ok  { background: var(--green-bg); color: var(--green); }
    .copies-badge.low { background: var(--orange-bg); color: var(--orange); }
    .copies-badge.out { background: var(--red-bg); color: var(--red); }

    .empty-state { text-align: center; padding: 48px 20px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    .spinner { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-header h2 { font-size: 18px; font-weight: 700; color: var(--text); }
    .count-badge { background: var(--maroon); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <img src="logo.png" alt="RAIT Logo" />
    <span>RAIT Smart Library — Admin</span>
  </div>
  <div class="nav-right">
    <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle dark/light theme" aria-label="Toggle theme">🌙</button>
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</nav>

<div class="page">

  <!-- LEFT: Add Book Form -->
  <div>
    <div class="panel">
      <div class="panel-header">Add New Book</div>
      <div class="panel-body">
        <form id="addBookForm" novalidate>

          <div class="field">
            <label>Book Title *</label>
            <input type="text" id="title" placeholder="e.g. Head First Java" />
          </div>

          <div class="field">
            <label>Author *</label>
            <input type="text" id="author" placeholder="e.g. Kathy Sierra" />
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div class="field">
              <label>Publishing Year *</label>
              <input type="number" id="publishingYear" placeholder="e.g. 2005" min="1900" max="2099" />
            </div>
            <div class="field">
              <label>Total Copies</label>
              <input type="number" id="totalCopies" placeholder="e.g. 5" min="1" value="1" />
            </div>
          </div>

          <div class="field">
            <label>ISBN</label>
            <input type="text" id="isbn" placeholder="e.g. 978-0596009205 (optional)" />
          </div>

          <div class="field">
            <label>Cover Image URL</label>
            <input type="url" id="imageUrl" placeholder="https://example.com/cover.jpg" />
            <div class="img-preview" id="imgPreview">
              <span class="placeholder">Image preview will appear here</span>
              <img id="previewImg" src="" alt="Cover preview" />
            </div>
          </div>

          <div class="field">
            <label>Description</label>
            <textarea id="description" placeholder="Brief description of the book..."></textarea>
          </div>

          <div class="field">
            <label>Tags</label>

            <div class="tag-group">
              <div class="tag-group-label">Programming Language</div>
              <div class="tag-chips" id="langTags"></div>
            </div>

            <div class="tag-group">
              <div class="tag-group-label">Academic Year</div>
              <div class="tag-chips" id="yearTags"></div>
            </div>

            <div class="tag-group">
              <div class="tag-group-label">Subject</div>
              <div class="tag-chips" id="subjectTags"></div>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Add Book</button>
        </form>
      </div>
    </div>
  </div>

  <!-- RIGHT: Books List & Search/Filter -->
  <div>
    <div class="section-header">
      <h2>All Books</h2>
      <span class="count-badge" id="bookCount">0</span>
    </div>

    <!-- Search & Filter UI -->
    <div class="filter-toolbar">
      <div class="search-input-wrap">
        <input type="text" id="adminSearch" class="filter-input" placeholder="Search by title or author..." />
      </div>
      <div class="filter-dropdowns">
        <select id="adminTagFilter" class="filter-select">
          <option value="">All Genres / Subjects</option>
        </select>
        <select id="adminAvailFilter" class="filter-select">
          <option value="">All Books</option>
          <option value="true">Available Only</option>
        </select>
      </div>
    </div>

    <div id="booksList">
      <div class="spinner">Loading books...</div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
var TOKEN, USER;
var adminSearchDebounceTimer = null;

var TAGS = {
  lang:    ["C", "C++", "Java", "Python", "JavaScript"],
  year:    ["1st Year", "2nd Year", "3rd Year", "4th Year"],
  subject: ["DBMS", "OOP", "Data Structures", "Operating Systems",
            "Computer Networks", "Mathematics", "Web Development",
            "AI/ML", "Software Engineering", "Compiler Design",
            "Cryptography", "Cloud Computing", "Mobile Development"]
};

// ── Theme management ─────────────────────────────────────────────────────────
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function applyTheme(theme) {
  if (theme === "dark") {
    $("body").attr("data-theme", "dark");
    document.documentElement.setAttribute("data-theme", "dark");
    $("#themeToggleBtn").html("☀️");
  } else {
    $("body").removeAttr("data-theme");
    document.documentElement.removeAttribute("data-theme");
    $("#themeToggleBtn").html("🌙");
  }
  try { localStorage.setItem("theme", theme); } catch(e) {}
  document.cookie = "theme=" + theme + "; path=/; max-age=31536000";
}

function initTheme() {
  var saved = getCookie("theme") || localStorage.getItem("theme") || "light";
  applyTheme(saved);

  $("#themeToggleBtn").on("click", function () {
    var cur = $("body").attr("data-theme") === "dark" || document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(cur);
  });
}

function showToast(msg, type) {
  var $t = $("#toast");
  $t.text(msg).removeClass("success error").addClass(type || "").addClass("show");
  setTimeout(function () { $t.removeClass("show success error"); }, 3500);
}

// ── Build tag checkboxes ─────────────────────────────────────────────────────
function buildTags(containerId, tags) {
  var html = "";
  tags.forEach(function (tag) {
    var id = "tag_" + tag.replace(/[^a-zA-Z0-9]/g, "_");
    html += '<div class="tag-chip">' +
      '<input type="checkbox" id="' + id + '" value="' + tag + '" class="tag-cb" />' +
      '<label for="' + id + '">' + tag + '</label>' +
      '</div>';
  });
  $("#" + containerId).html(html);
}

function getSelectedTags() {
  var selected = [];
  $(".tag-cb:checked").each(function () { selected.push($(this).val()); });
  return selected;
}

// ── Image preview ────────────────────────────────────────────────────────────
var previewTimer;
$("#imageUrl").on("input", function () {
  clearTimeout(previewTimer);
  var url = $(this).val().trim();
  if (!url) {
    $("#previewImg").hide();
    $(".placeholder").show();
    return;
  }
  previewTimer = setTimeout(function () {
    $("#previewImg")
      .attr("src", url)
      .off("load error")
      .on("load",  function () { $(this).show(); $(".placeholder").hide(); })
      .on("error", function () { $(this).hide(); $(".placeholder").show().text("Invalid image URL"); });
  }, 600);
});

// ── Load books with Search & Filter ──────────────────────────────────────────
function loadBooks() {
  var search = $("#adminSearch").val() ? $("#adminSearch").val().trim() : "";
  var tag    = $("#adminTagFilter").val() || "";
  var avail  = $("#adminAvailFilter").val() || "";

  var queryParams = [];
  if (search) queryParams.push("search=" + encodeURIComponent(search));
  if (tag)    queryParams.push("tags=" + encodeURIComponent(tag));
  if (avail)  queryParams.push("available=" + encodeURIComponent(avail));

  var url = "http://localhost:5000/api/books" + (queryParams.length ? "?" + queryParams.join("&") : "");

  $.ajax({
    url: url,
    headers: { Authorization: "Bearer " + TOKEN },
    success: function (books) {
      $("#bookCount").text(books.length);
      if (books.length === 0) {
        $("#booksList").html('<div class="empty-state">No books match your criteria.</div>');
        return;
      }

      var html = '<div class="books-list">';
      books.forEach(function (book) {
        var coverHtml = book.imageUrl
          ? '<img class="book-cover" src="' + book.imageUrl + '" alt="cover" onerror="this.style.display=\'none\'" />'
          : '<div class="book-cover no-img">📚</div>';

        var tagsHtml = (book.tags || []).map(function (t) {
          return '<span class="tag-pill">' + $("<div>").text(t).html() + "</span>";
        }).join("");

        var avail = book.availableCopies !== undefined ? book.availableCopies : (book.quantity || 0);
        var total = book.totalCopies !== undefined ? book.totalCopies : (book.quantity || 1);
        var copiesClass = avail === 0 ? "out" : avail <= 2 ? "low" : "ok";
        var copiesLabel = avail + "/" + total + " available";

        html += '<div class="book-item">' +
          coverHtml +
          '<div class="book-info">' +
            '<h3>' + $("<div>").text(book.title).html() + '</h3>' +
            '<div class="author">by ' + $("<div>").text(book.author).html() + (book.publishingYear ? " &bull; " + book.publishingYear : "") + '</div>' +
            '<div class="book-tags">' + tagsHtml + '</div>' +
            '<div class="book-meta">ISBN: ' + (book.isbn || "—") + '</div>' +
          '</div>' +
          '<div class="book-actions">' +
            '<span class="copies-badge ' + copiesClass + '">' + copiesLabel + '</span>' +
            '<button class="del-btn" data-id="' + book._id + '">Delete</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      $("#booksList").html(html);

      // Delete handler
      $(document).off("click", ".del-btn").on("click", ".del-btn", function () {
        var id  = $(this).data("id");
        var $btn = $(this);
        if (!confirm("Delete this book? This cannot be undone.")) return;
        $btn.text("Deleting...").prop("disabled", true);
        $.ajax({
          url:     "http://localhost:5000/api/books/" + id,
          method:  "DELETE",
          headers: { Authorization: "Bearer " + TOKEN },
          success: function () { showToast("Book deleted.", "success"); loadBooks(); },
          error:   function (xhr) {
            showToast((xhr.responseJSON && xhr.responseJSON.message) || "Delete failed.", "error");
            $btn.text("Delete").prop("disabled", false);
          }
        });
      });
    },
    error: function () {
      $("#booksList").html('<div class="empty-state">Could not load books.</div>');
    }
  });
}

// ── Add book form ────────────────────────────────────────────────────────────
$("#addBookForm").on("submit", function (e) {
  e.preventDefault();

  var title  = $("#title").val().trim();
  var author = $("#author").val().trim();
  var year   = parseInt($("#publishingYear").val());

  if (!title)        { showToast("Title is required.", "error"); return; }
  if (!author)       { showToast("Author is required.", "error"); return; }
  if (!year || year < 1000) { showToast("Enter a valid publishing year.", "error"); return; }

  var payload = {
    title:           title,
    author:          author,
    publishingYear:  year,
    imageUrl:        $("#imageUrl").val().trim() || null,
    tags:            getSelectedTags(),
    description:     $("#description").val().trim(),
    isbn:            $("#isbn").val().trim() || undefined,
    totalCopies:     parseInt($("#totalCopies").val()) || 1
  };

  var $btn = $("#submitBtn").prop("disabled", true).text("Adding...");

  $.ajax({
    url:         "http://localhost:5000/api/books",
    method:      "POST",
    contentType: "application/json",
    headers:     { Authorization: "Bearer " + TOKEN },
    data:        JSON.stringify(payload),
    success: function () {
      showToast("Book added successfully!", "success");
      $("#addBookForm")[0].reset();
      $("#previewImg").hide();
      $(".placeholder").show().text("Image preview will appear here");
      $(".tag-cb").prop("checked", false);
      $btn.prop("disabled", false).text("Add Book");
      loadBooks();
    },
    error: function (xhr) {
      showToast((xhr.responseJSON && xhr.responseJSON.message) || "Failed to add book.", "error");
      $btn.prop("disabled", false).text("Add Book");
    }
  });
});

// ── Init ─────────────────────────────────────────────────────────────────────
$(function () {
  initTheme();

  TOKEN = localStorage.getItem("token");
  USER  = JSON.parse(localStorage.getItem("user") || "null");

  if (!TOKEN || !USER) { window.location.href = "/login.html"; return; }
  if (USER.role !== "admin") {
    alert("Access denied. Admins only.");
    window.location.href = "/dashboard.html";
    return;
  }

  buildTags("langTags",    TAGS.lang);
  buildTags("yearTags",    TAGS.year);
  buildTags("subjectTags", TAGS.subject);

  // Populate admin filter tags dropdown
  var allFilterTags = TAGS.lang.concat(TAGS.subject);
  allFilterTags.forEach(function (tag) {
    $("#adminTagFilter").append($("<option>", { value: tag, text: tag }));
  });

  // Debounced search handler
  $("#adminSearch").on("input", function () {
    clearTimeout(adminSearchDebounceTimer);
    adminSearchDebounceTimer = setTimeout(function () {
      loadBooks();
    }, 300);
  });

  // Filter change handlers
  $("#adminTagFilter, #adminAvailFilter").on("change", function () {
    loadBooks();
  });

  $("#logoutBtn").on("click", function () {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "/login.html";
  });

  loadBooks();
});
</script>
</body>
</html>
